<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        h2 {
            padding-bottom: 10px;
        }
        .audio-container {
            text-align: center;
            margin: 30px 0;
        }
        audio {
            width: 100%;
            max-width: 600px;
        }
        .visualization-container {
            margin: 30px 0;
        }
        canvas {
            width: 100%;
            height: 400px;
            display: block;
        }
        .controls {
            margin: 20px 0;
            padding: 15px;
        }
        .channel-controls {
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        .channel-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="audio-container">
        <audio id="audioPlayer" controls loop>
            <source src="vlog-beat-background-349853.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="visualization-container">
        <h2>Z1</h2>
        <canvas id="spectrumCanvas"></canvas>
    </div>

    <div class="visualization-container">
        <h2>Z2</h2>
        <div class="controls">
            <div class="channel-controls">
                <div class="channel-control">
                    <input type="checkbox" id="leftChannelToggle" checked>
                    <label for="leftChannelToggle">Lewy</label>
                </div>
                <div class="channel-control">
                    <input type="checkbox" id="rightChannelToggle" checked>
                    <label for="rightChannelToggle">Prawy</label>
                </div>
            </div>
        </div>
        <canvas id="oscilloscopeCanvas"></canvas>
    </div>

    <script src="audio.js"></script>
</body>
</html>
